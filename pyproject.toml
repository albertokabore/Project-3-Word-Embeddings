[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "word-embeddings"
version = "1.0.0"
description = "TF-IDF document embeddings and PCA from scratch on the BBC News dataset"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
report = ["python-docx>=1.1", "reportlab>=4", "markdown-it-py>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
